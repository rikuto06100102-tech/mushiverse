確認が必要な場合はメールで案内します。</p><p><a href="./privacy.html">プライバシーポリシー</a> ／ <a href="./terms.html">利用規約</a></p></section></main><footer>© MUSHIVERSE</footer><script>document.getElementById('send').addEventListener('click',function(){const type=document.getElementById('type').value;const msg=document.getElementById('message').value.trim();const body='お問い合わせの種類：'+type+'\n\n内容：\n'+(msg||'（ここに内容を記入してください）')+'\n\n※パスワード・認証コードは記載しないでください。';location.href='mailto:zeazzi244@gmail.com?subject='+encodeURIComponent('【ムシバース】'+type)+'&body='+encodeURIComponent(body)});</script></body></html>
