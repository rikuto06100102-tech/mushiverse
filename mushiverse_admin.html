<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ムシバース｜通報管理</title>
<style>body{font-family:system-ui,sans-serif;background:#edf5eb;color:#163d2c;margin:0;padding:18px}main{max-width:680px;margin:auto}section{background:white;padding:18px;border-radius:18px;margin:14px 0}button,input,select{font:inherit;padding:10px;border-radius:10px;border:1px solid #9ab9a5}button{background:#1d754e;color:white;cursor:pointer}input{width:90%;margin:6px 0}article{border-top:1px solid #ddd;padding:12px 0;overflow-wrap:anywhere}small{color:#596e60}</style>
<main><h1>🪲 ムシバース 通報管理</h1><section><p>運営者としてログインしてください。運営者登録がないアカウントでは通報を閲覧できません。</p><input id="email" type="email" placeholder="メールアドレス" autocomplete="email"><input id="password" type="password" placeholder="パスワード" autocomplete="current-password"><button id="login">ログイン</button> <button id="logout">ログアウト</button><p id="message" role="status"></p></section><section><button id="refresh">通報を読み込む</button><div id="reports"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const client=window.supabase.createClient('https://jhowxtdemlsmetcwhekr.supabase.co','sb_publishable_b2n0sVChm2zvGQ5qIbz8Cw_B-wCOtVJ');
const $=id=>document.getElementById(id);const say=t=>$('message').textContent=t;
$('login').onclick=async()=>{const {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){say('ログイン失敗: '+error.message);return} $('password').value='';say('ログインしました');await load()};
$('logout').onclick=async()=>{await client.auth.signOut();$('reports').replaceChildren();say('ログアウトしました')};
$('refresh').onclick=load;
async function load(){const {data,error}=await client.rpc('moderator_list_reports');$('reports').replaceChildren();if(error){say('一覧を表示できません: '+error.message);return}say(`${data.length}件の通報`);for(const r of data){const a=document.createElement('article'),reason=document.createElement('p'),meta=document.createElement('small'),sel=document.createElement('select'),btn=document.createElement('button');reason.textContent=r.reason;meta.textContent=`${r.comment_id?'コメント':'投稿'} | ${new Date(r.created_at).toLocaleString('ja-JP')} | ${r.id}`;for(const [v,t] of [['pending','未対応'],['reviewed','確認済み'],['resolved','対応完了']]){const o=document.createElement('option');o.value=v;o.textContent=t;sel.append(o)}sel.value=r.status;btn.textContent='状態を保存';btn.onclick=async()=>{btn.disabled=true;const {data:ok,error:e}=await client.rpc('moderator_set_report_status',{p_report_id:r.id,p_status:sel.value});btn.disabled=false;say(e?'変更失敗: '+e.message:ok?'変更しました':'対象が見つかりません')};a.append(meta,reason,sel,btn);$('reports').append(a)}}
</script></html>
